<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">CNC1 UserPanel</title>
  <desc id="desc">Browser extension for CNC1 and Bitrix catalog administration with tools for properties, product tables, SEO sorting, images, and distracting widgets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#334155" stroke-width="1" opacity=".35"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="30" fill="url(#grid)" opacity=".42"/>

  <g transform="translate(56 48)">
    <text x="0" y="0" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1.8">
      CHROME MV3 · WXT · BITRIX ADMIN
    </text>
    <text x="0" y="82" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="68" font-weight="850">
      CNC1 UserPanel
    </text>
    <text x="0" y="124" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="500">
      Инструменты администратора для каталога CNC1:
    </text>
    <text x="0" y="160" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="500">
      свойства, товары, seo_sort, картинки и лишние виджеты.
    </text>

    <g transform="translate(0 212)">
      <rect x="0" y="0" width="190" height="44" rx="14" fill="#0f766e" opacity=".92"/>
      <text x="18" y="29" fill="#ecfeff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="750">1.6.0 release</text>

      <rect x="208" y="0" width="205" height="44" rx="14" fill="#1e293b" stroke="#334155"/>
      <text x="226" y="29" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">cnc1.ru · technowood</text>

      <rect x="431" y="0" width="138" height="44" rx="14" fill="#1e293b" stroke="#334155"/>
      <text x="449" y="29" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">Bitrix tools</text>
    </g>
  </g>

  <g transform="translate(735 46)">
    <rect x="0" y="0" width="390" height="288" rx="22" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <rect x="0" y="0" width="390" height="48" rx="22" fill="#e2e8f0"/>
    <rect x="0" y="34" width="390" height="14" fill="#e2e8f0"/>
    <text x="22" y="31" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="800">Bitrix catalog table</text>

    <g transform="translate(22 72)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
      <rect x="0" y="0" width="346" height="38" rx="10" fill="#dbeafe"/>
      <text x="16" y="25" fill="#1e3a8a" font-weight="800">Артикул</text>
      <text x="112" y="25" fill="#1e3a8a" font-weight="800">Бренд</text>
      <text x="205" y="25" fill="#1e3a8a" font-weight="800">D, мм</text>
      <text x="286" y="25" fill="#1e3a8a" font-weight="800">Цена</text>

      <g transform="translate(0 56)" fill="#334155">
        <rect x="0" y="0" width="346" height="34" rx="9" fill="#ffffff" stroke="#e2e8f0"/>
        <text x="16" y="23">CNMG...</text>
        <text x="112" y="23">YBG</text>
        <text x="205" y="23">12</text>
        <text x="286" y="23">...</text>
      </g>
      <g transform="translate(0 102)" fill="#334155">
        <rect x="0" y="0" width="346" height="34" rx="9" fill="#fff7ed" stroke="#fed7aa"/>
        <text x="16" y="23">TCMT...</text>
        <text x="112" y="23">-</text>
        <text x="205" y="23">-</text>
        <text x="286" y="23">...</text>
      </g>
    </g>

    <g transform="translate(44 226)">
      <path d="M0 0H92" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
      <path d="M118 0H210" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
      <path d="M236 0H300" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
      <text x="0" y="34" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="700">проверка → подстановка → сохранение</text>
    </g>
  </g>

  <g transform="translate(650 236)">
    <rect x="0" y="0" width="184" height="104" rx="18" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
    <text x="18" y="32" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="800">Side panel</text>
    <text x="18" y="60" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">Инструменты</text>
    <text x="18" y="84" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">Стили · Шаблоны</text>
  </g>
</svg>
